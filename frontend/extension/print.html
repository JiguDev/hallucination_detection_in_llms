<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Export</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #333333;
        }
        
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .message {
            margin-bottom: 24px;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .role-label {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Platform specific themes */
        
        /* ChatGPT Theme */
        body.theme-chatgpt { background-color: #343541; color: #ececf1; }
        .theme-chatgpt .message.user { background-color: #343541; }
        .theme-chatgpt .message.ai { background-color: #444654; }
        .theme-chatgpt .role-label { color: #d1d5db; }
        
        /* Claude Theme */
        body.theme-claude { background-color: #ffffff; color: #1a1a1a; }
        .theme-claude .message.user { background-color: #f7f7f8; border: 1px solid #e5e7eb; }
        .theme-claude .message.ai { background-color: #ffffff; border: 1px solid #e5e7eb; }
        .theme-claude .role-label { color: #555555; font-family: Georgia, serif; }

        /* Gemini Theme */
        body.theme-gemini { background-color: #1e1f20; color: #e3e3e3; }
        .theme-gemini .message.user { background-color: #282a2c; border-radius: 20px; margin-left: 40px; }
        .theme-gemini .message.ai { background-color: transparent; }
        .theme-gemini .role-label { color: #a8c7fa; }
        
        /* Default Theme */
        body.theme-unknown { background-color: #ffffff; }
        .theme-unknown .message.user { background-color: #f0f0f0; }
        .theme-unknown .message.ai { background-color: #e3f2fd; }

        .content {
            white-space: pre-wrap;
        }

        @media print {
            body { 
                background-color: white !important; 
                color: black !important;
            }
            .message {
                break-inside: avoid;
                border: 1px solid #ccc !important;
                background-color: white !important;
                color: black !important;
                margin-bottom: 12px;
            }
            .role-label { color: black !important; }
        }
    </style>
</head>
<body>
    <div id="chat-container" class="chat-container">
        <!-- Messages injected here -->
    </div>
    <script src="print.js"></script>
</body>
</html>
