<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hallucination Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1>Fact-Check AI</h1>
            </div>
            <p class="subtitle">Detect hallucinations using RAG evidence</p>
        </header>

        <main>
            <div class="input-group">
                <label for="prompt">Prompt / Question (Optional)</label>
                <textarea id="prompt" rows="2" placeholder="e.g. What is the capital of France?"></textarea>
            </div>
            
            <div class="input-group">
                <label for="ai-response">AI Response to Check</label>
                <textarea id="ai-response" rows="4" placeholder="Paste the AI's response here..."></textarea>
            </div>

            <button id="analyze-btn">
                <span class="btn-text">Analyze</span>
                <div class="loader hidden"></div>
            </button>

            <div id="result-container" class="result-card hidden">
                <div class="verdict-header">
                    <h2 id="verdict-title">Verdict</h2>
                    <span id="confidence-badge" class="badge">90%</span>
                </div>
                <p id="explanation-text" class="explanation"></p>
                
                <div id="sources-container" class="sources hidden">
                    <h3>Supporting Sources</h3>
                    <ul id="sources-list"></ul>
                </div>
            </div>

            <hr style="margin: 20px 0; border: 1px solid #eaeaea;">

            <div class="ledger-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>State Management & Migration</h3>
                    <div class="ledger-tools" style="display: flex; gap: 8px; align-items: center;">
                        <button id="clear-ledger-btn" class="hidden" title="Clear chat history and attachments" style="background: none; border: none; cursor: pointer; padding: 4px; color: var(--text-muted); display: flex; align-items: center;">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                        <button id="copy-ledger-btn" title="Copy to clipboard" style="background: none; border: none; cursor: pointer; padding: 4px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                        <div style="position: relative;">
                            <button id="download-ledger-btn" title="Download options" style="background: none; border: none; cursor: pointer; padding: 4px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            </button>
                            <div id="download-menu" class="hidden" style="position: absolute; right: 0; top: 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; min-width: 120px; z-index: 10;">
                                <button id="dl-md-btn" style="background: transparent; border: none; color: white; padding: 6px 8px; text-align: left; font-size: 0.8rem; cursor: pointer; justify-content: flex-start;">Markdown (.md)</button>
                                <button id="dl-pdf-btn" style="background: transparent; border: none; color: white; padding: 6px 8px; text-align: left; font-size: 0.8rem; cursor: pointer; justify-content: flex-start;">PDF (.pdf)</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="files-preview-container" class="files-preview-container hidden">
                    <span style="font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; width: 100%;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        Captured Attachments:
                    </span>
                    <div id="file-chips-list" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                </div>

                <div class="input-group">
                    <label for="chat-ledger" style="display: none;">Continuous Chat Ledger</label>
                    <textarea id="chat-ledger" rows="4" placeholder="Chat history and summaries will appear here..."></textarea>
                </div>
                
                <div class="actions-row">
                    <button id="sync-chat-btn" class="secondary-btn" title="Extract complete chat and uploaded files without limits">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Sync Chat & Files
                    </button>
                    <button id="summarize-chat-btn" class="summarize-btn" title="Extract and generate an executive summary of the chat session">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        Summarize Chat
                    </button>
                </div>

                <!-- Dedicated Chat Summary Card -->
                <div id="chat-summary-container" class="summary-card hidden">
                    <div class="summary-header">
                        <h4>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            Executive Chat Summary
                        </h4>
                        <div class="summary-actions">
                            <button id="copy-summary-btn" class="icon-btn" title="Copy Summary">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                            <button id="close-summary-btn" class="icon-btn" title="Close Summary">✕</button>
                        </div>
                    </div>
                    <div id="summary-content" class="summary-content"></div>
                </div>

                <div class="migration-actions" id="migration-buttons-container">
                    <button id="migrate-chatgpt-btn" class="migrate-btn chatgpt hidden" style="background-color: #10a37f; color: white;">Migrate to ChatGPT</button>
                    <button id="migrate-claude-btn" class="migrate-btn claude hidden">Migrate to Claude</button>
                    <button id="migrate-gemini-btn" class="migrate-btn gemini hidden">Migrate to Gemini</button>
                </div>
            </div>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
